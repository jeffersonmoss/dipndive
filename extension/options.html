<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Dip and Dive options</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; font: inherit; border-radius: 6px; border: 1px solid #888; background: Canvas; color: CanvasText; }
    button { margin-top: 16px; padding: 8px 16px; font: inherit; border-radius: 6px; cursor: pointer; }
    #msg { margin-top: 12px; }
    small { color: GrayText; }
  </style>
</head>
<body>
  <h1>Dip and Dive</h1>
  <label for="base">Companion URL</label>
  <input id="base" type="url" placeholder="https://imac.your-tailnet.ts.net" autocomplete="off">
  <small>The iMac's tailscale serve address. http://127.0.0.1:PORT is allowed for local testing.</small>
  <label for="token">Token</label>
  <input id="token" type="password" autocomplete="off">
  <small>Copy it by hand from the iMac: Library/Application Support/DipDive/token. Stored on this machine only.</small>
  <div><button id="save" type="button">Save and test</button></div>
  <div id="msg" role="status"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
