<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Dip'n'Dive</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="page">
  <form id="urlform" autocomplete="off">
    <input id="urlinput" type="text" inputmode="url" placeholder="Paste a link" aria-label="Link to summarize" spellcheck="false" autocomplete="off">
    <button id="go" type="submit">Go</button>
  </form>
  <div id="hint" class="muted" hidden>Paste a link above (Cmd+V or Ctrl+V) and press Go, or right-click any link or page.</div>
  <header>
    <a id="title" href="#" target="_blank" rel="noopener noreferrer" hidden></a>
  </header>
  <div id="buttons" role="group" aria-label="Dip and hand-off actions"></div>
  <div id="pinmsg" class="error" role="alert" hidden></div>
  <div id="codexnote" class="reason" hidden></div>
  <main id="result" aria-live="polite"></main>
  <div id="thread" aria-live="polite"></div>
  <div id="error" class="error" role="alert" hidden></div>
  <footer>
    <div id="status" class="muted"></div>
    <div class="links">
      <label id="saveline" class="savebox" hidden><input id="savehist" type="checkbox" checked><span id="savelabel">Save this Dip to history</span></label>
      <div id="clipline" class="clipline">
        <button id="clipbutton" type="button" disabled>Send to clipboard</button>
        <label><input type="checkbox" data-machine="thing-2" checked><span>Thing 2</span></label>
        <label><input type="checkbox" data-machine="thing-1" checked><span>Thing 1</span></label>
        <label><input type="checkbox" data-machine="imac" checked><span>iMac</span></label>
        <label><input type="checkbox" data-machine="win" checked><span>Win</span></label>
        <span id="clipstatus" class="muted" role="status"></span>
      </div>
      <button id="options" class="iconbtn" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M10.16 4.32L10.45 1.72L13.55 1.72L13.84 4.32L16.13 5.26L18.18 3.63L20.37 5.82L18.74 7.87L19.68 10.16L22.28 10.45L22.28 13.55L19.68 13.84L18.74 16.13L20.37 18.18L18.18 20.37L16.13 18.74L13.84 19.68L13.55 22.28L10.45 22.28L10.16 19.68L7.87 18.74L5.82 20.37L3.63 18.18L5.26 16.13L4.32 13.84L1.72 13.55L1.72 10.45L4.32 10.16L5.26 7.87L3.63 5.82L5.82 3.63L7.87 5.26ZM15.4 12A3.4 3.4 0 1 0 8.6 12A3.4 3.4 0 1 0 15.4 12Z"/></svg></button>
    </div>
  </footer>
  </div>
  <section id="ask" aria-label="Ask a question about this source" hidden>
    <div id="askerror" class="error" role="alert" hidden></div>
    <div id="micmsg" class="micmsg" role="status" hidden></div>
    <button id="micsetup" type="button" hidden>Enable microphone</button>
    <div id="askrow">
      <button id="historylink" class="rowbtn" type="button" aria-label="History" title="History"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M6 2.75h12M6 21.25h12M7.5 2.75v3.1c0 1.7.9 3.2 2.3 4.1L12 11.3l2.2-1.35c1.4-.9 2.3-2.4 2.3-4.1v-3.1M7.5 21.25v-3.1c0-1.7.9-3.2 2.3-4.1L12 12.7l2.2 1.35c1.4.9 2.3 2.4 2.3 4.1v3.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.6 19.4c.5-1.6 1.4-2.5 2.4-2.9 1 .4 1.9 1.3 2.4 2.9z" fill="currentColor"/></svg></button>
      <form id="askform" autocomplete="off">
        <input id="askinput" type="text" placeholder="Dive in..." aria-label="Dive in: ask about this source" spellcheck="true" autocomplete="off" maxlength="2000">
        <button id="mic" class="rowbtn" type="button" data-state="idle" aria-label="Start recording" title="Start recording">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span id="miclabel" class="sr-only">Start recording</span>
        </button>
        <button id="askgo" class="rowbtn" type="submit" title="Ask">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M19 5v7.5a2 2 0 0 1-2 2H6M10 10.5l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="sr-only">Ask</span>
        </button>
      </form>
    </div>
  </section>
  <script type="module" src="panel.js"></script>
</body>
</html>
